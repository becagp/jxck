    function addLog(category, content) {
        const logDom = document.getElementById("log");
        const item = document.createElement("div");
        item.className = "log-item";

        let prefix = "";
        if (category === "门派CP") {
            prefix = "⚔️ 【门派CP】";
        } else if (category === "结局") {
            prefix = "🎭 【结局】";
        } else if (category === "梗题") {
            prefix = "📝 【梗题】";
        } else {
            prefix = "📌 ";
        }

        item.innerText = prefix + content;
        logDom.appendChild(item);
        logDom.scrollTop = logDom.scrollHeight;

        if (logDom.children.length > 81) {
            logDom.removeChild(logDom.children[1]);
        }
    }
